# ServerManager Configuration

# Enable or disable Discord webhook integration (requires discordWebhookUrl to be set)
discordWebhooksEnabled: false

# The Discord webhook URL for sending notifications (leave empty to disable)
discordWebhookUrl: ""

# Enable or disable cron job scheduling
cronJobsEnabled: false

# Enable or disable the Out-Of-Memory (OOM) killer
oomKillerEnabled: false

# Maximum total memory (in MB) allowed for all processes managed by the plugin. Set to 0 for no limit.
totalMemoryLimitMB: 0

# Color palette for message theming
palette:
  primary: "blue"
  secondary: "green"
  foreground: "white"
  placeholder: "gray"
  success: "green"
  failure: "red"
  warning: "yellow"
  details: "dark_aqua"
